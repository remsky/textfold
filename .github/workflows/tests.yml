# TextFold's tests on every pull request: the other workflows run them only when a version is tagged.
name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover tests
      - run: node --test desktop/links.test.js tests/*.test.cjs
